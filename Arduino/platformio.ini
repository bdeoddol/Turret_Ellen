; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

;baud rate
; monitor_speed = 9600

;allows one to specify which source files should be included or excluded from src_dir for a build process. Filter supports two templates:
;+<PATH> include template
;-<PATH> exclude template

build_src_filter  = -<tests/*.cpp> +<main.cpp> +<Util.cpp>
; build_src_filter = -<**/*.cpp> +<tests/testReadSerial.cpp> +<Util.cpp>
